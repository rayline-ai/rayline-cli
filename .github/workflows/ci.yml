name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.88.0"
  RAYLINE_VERSION: "0.2.0-dev.0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"

      - name: Metadata
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Test
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Validate release install and local lifecycle
        run: |
          cargo build --locked -p rayline-cli
          python3 scripts/test-release-install.py
          python3 scripts/test-local-lifecycle.py

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Check MSRV build
        run: cargo check --workspace --all-targets --locked

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            allow_failure: false
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            allow_failure: false
          - platform: macos-arm64
            os: macos-15
            allow_failure: false
          - platform: windows-x64
            os: windows-latest
            allow_failure: false
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"

      # Linux builds as releases do, in the encoder's pinned image, and checks the glibc floor.
      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            scripts/build-linux-cli.sh
          else
            cargo build --release -p rayline-cli --locked
          fi

      # `.cargo/config.toml` links the C runtime statically: the exe must not
      # need the Visual C++ redistributable.
      - name: Check Windows imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $exe = 'target\release\rayline.exe'
          & $dumpbin /nologo /dependents $exe
          $imports = & $dumpbin /nologo /dependents $exe |
            Where-Object { $_ -match '^\s+(\S+\.dll)\s*$' } | ForEach-Object { $Matches[1].ToLowerInvariant() }
          $crt = $imports | Where-Object { $_ -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)' }
          if ($crt) { throw "rayline.exe imports the C runtime: $($crt -join ', ')" }

      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rayline-windows-x64
          path: target/release/rayline.exe
          retention-days: 3

      - name: Clippy (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install-rayline.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
